      document.addEventListener("DOMContentLoaded", () => {
        const contactForm = document.getElementById("contact-form");

        contactForm.addEventListener("submit", (event) => {
          event.preventDefault();
          const name = document.getElementById("name")?.value || "";

          const email = document.getElementById("email")?.value || "";
          const city = document.getElementById("city")?.value || "";

            "_blank"
          );
          contactForm.reset();
        });
      });
    </script>

<script>
(function() {
  if (!('IntersectionObserver' in window)) return;
  var links = document.querySelectorAll('.article-toc-link[data-toc-target]');
  if (!links.length) return;
  var byId = {};
  links.forEach(function(l) {
    var id = l.getAttribute('data-toc-target');
    var el = document.getElementById(id);
    if (el) byId[id] = { link: l, el: el };
  });
  var ids = Object.keys(byId);
  if (!ids.length) return;
  var visible = {};
  var io = new IntersectionObserver(function(entries) {
    entries.forEach(function(en) {
      visible[en.target.id] = en.intersectionRatio;
    });
    // Encontrar el item visible más arriba
    var activeId = null;
    var firstVisible = null;
    for (var i = 0; i < ids.length; i++) {
      if (visible[ids[i]] > 0) {
        if (!firstVisible) firstVisible = ids[i];
      }
    }
    activeId = firstVisible;
    links.forEach(function(l) { l.classList.remove('is-active'); });
    if (activeId && byId[activeId]) byId[activeId].link.classList.add('is-active');
  }, { rootMargin: '-90px 0px -60% 0px', threshold: [0, 0.1, 0.5, 1] });
  ids.forEach(function(id) { io.observe(byId[id].el); });
})();
</script>

<style>
  /* === Layout 2 columnas: sidebar + contenido === */
  .article-layout {
    display: grid;
    grid-template-columns: 1fr;
    gap: 0;
    max-width: 1280px;
    margin: 0 auto;
  }
  @media (min-width: 1024px) {
    .article-layout {
      grid-template-columns: 280px 1fr;
      gap: 2.5rem;
      padding: 0 1.5rem;
    }
  }
  @media (min-width: 1280px) {
    .article-layout {
      grid-template-columns: 300px 1fr;
      gap: 3rem;
    }
  }

  /* === Sidebar TOC sticky === */
  .article-sidebar {
    display: none;
  }
  @media (min-width: 1024px) {
    .article-sidebar {
      display: block;
    }
  }
  .article-sidebar__inner {
    position: sticky;
    top: 90px;
    padding: 1.25rem 0;
    max-height: calc(100vh - 100px);
    overflow-y: auto;
  }
  .article-sidebar__title {
    font-size: 0.7rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #0077b6;
    margin: 0 0 0.85rem;
    padding: 0 0.25rem;
  }
  .article-toc {
    display: flex;
    flex-direction: column;
    gap: 1px;
    border-left: 2px solid #e2e8f0;
  }
  .article-toc-link {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 0.85rem;
    margin-left: -2px;
    border-left: 2px solid transparent;
    color: #475569;
    text-decoration: none;
    font-size: 0.875rem;
    line-height: 1.3;
    transition: color 0.15s ease, border-color 0.15s ease, background 0.15s ease;
  }
  .article-toc-link i {
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .article-toc-link:hover {
    color: #0077b6;
    border-left-color: #0077b6;
    background: #f0f9ff;
  }
  .article-toc-link:hover i {
    opacity: 1;
    transform: translateX(2px);
  }
  .article-toc-link.is-active {
    color: #0077b6;
    font-weight: 700;
    border-left-color: #0077b6;
    background: #e0f2fe;
  }
  .article-toc-link.is-active i {
    opacity: 1;
  }
  .article-sidebar__cta {
    margin-top: 1.5rem;
    padding: 1rem;
    background: #f8fafc;
    border-radius: 12px;
    border: 1px solid #e2e8f0;
  }
  .article-sidebar__wa,
  .article-sidebar__calc {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    width: 100%;
    padding: 0.65rem 0.85rem;
    border-radius: 999px;
    font-size: 0.82rem;
    font-weight: 700;
    text-decoration: none;
    margin-top: 0.5rem;
    transition: background 0.15s ease, transform 0.15s ease;
  }
  .article-sidebar__wa {
    background: #25d366;
    color: #fff;
  }
  .article-sidebar__wa:hover {
    background: #1ebe5d;
    transform: translateY(-1px);
  }
  .article-sidebar__calc {
    background: #fff;
    color: #0077b6;
    border: 1.5px solid #e2e8f0;
  }
  .article-sidebar__calc:hover {
    background: #eff6ff;
    border-color: #0077b6;
  }

  /* === Main article === */
  .article-main {
    min-width: 0;
  }
  .article-main section {
    scroll-margin-top: 90px;
  }
  .article-main h2 {
    scroll-margin-top: 90px;
  }

  /* === Mobile: TOC visible como bloque horizontal scrollable arriba de cada sección === */
  @media (max-width: 1023px) {
    .article-layout {
      padding: 0;
    }
  }
</style>

<style>
  /* === Tablas comparativas === */
  .compare-table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.06);
  }
  .compare-table th, .compare-table td {
    padding: 0.85rem 1rem;
    text-align: left;
    border-bottom: 1px solid #e2e8f0;
    font-size: 0.92rem;
  }
  .compare-table th {
    background: linear-gradient(135deg, #0077b6 0%, #00a8e8 100%);
    color: #fff;
    font-weight: 700;
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .compare-table tr:last-child td { border-bottom: 0; }
  .compare-table tr:hover td { background: #f0f9ff; }
  .compare-table .check { color: #10b981; font-weight: 700; }
  .compare-table .cross { color: #ef4444; font-weight: 700; }
  .compare-table .partial { color: #f59e0b; font-weight: 700; }
  @media (max-width: 640px) {
    .compare-table th, .compare-table td { padding: 0.6rem 0.5rem; font-size: 0.82rem; }
  }
  /* === Stats === */
  .stat-card {
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 14px;
    padding: 1.25rem 1rem;
    text-align: center;
  }
  .stat-card__num {
    font-size: 1.85rem;
    font-weight: 800;
    color: #0077b6;
    line-height: 1.1;
  }
  .stat-card__label {
    font-size: 0.82rem;
    color: #64748b;
    margin-top: 0.3rem;
  }
  /* === Pricing tier === */
  .price-tier {
    background: #fff;
    border: 2px solid #e2e8f0;
    border-radius: 16px;
    padding: 1.5rem;
    text-align: center;
    transition: border-color 0.18s ease, transform 0.18s ease;
  }
  .price-tier:hover {
    border-color: #0077b6;
    transform: translateY(-2px);
  }
  .price-tier--featured {
    border-color: #0077b6;
    background: linear-gradient(180deg, #f0f9ff 0%, #fff 100%);
  }
  .price-tier__name {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #0077b6;
  }
  .price-tier__price {
    font-size: 1.6rem;
    font-weight: 800;
    color: #0a2540;
    margin: 0.4rem 0;
  }
  .price-tier__price small {
    font-size: 0.78rem;
    font-weight: 500;
    color: #64748b;
  }
  .price-tier__list {
    text-align: left;
    list-style: none;
    padding: 0;
    margin: 1rem 0;
  }
  .price-tier__list li {
    padding: 0.35rem 0;
    font-size: 0.85rem;
    color: #475569;
    display: flex;
    align-items: flex-start;
    gap: 0.4rem;
  }
  .price-tier__list li::before {
    content: "✓";
    color: #10b981;
    font-weight: 700;
    flex-shrink: 0;
  }
  /* === Timeline === */
  .timeline {
    position: relative;
    padding: 1rem 0;
  }
  .timeline::before {
    content: "";
    position: absolute;
    left: 1.25rem;
    top: 0;
    bottom: 0;
    width: 2px;
    background: #e2e8f0;
  }
  .timeline-item {
    position: relative;
    padding-left: 3.5rem;
    padding-bottom: 1.75rem;
  }
  .timeline-item:last-child { padding-bottom: 0; }
  .timeline-item::before {
    content: "";
    position: absolute;
    left: 0.5rem;
    top: 0.3rem;
    width: 1.5rem;
    height: 1.5rem;
    background: #0077b6;
    border: 3px solid #fff;
    border-radius: 50%;
    box-shadow: 0 0 0 2px #0077b6;
  }
  .timeline-item__week {
    font-size: 0.78rem;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #0077b6;
  }
  .timeline-item__title {
    font-size: 1.05rem;
    font-weight: 700;
    color: #0a2540;
    margin: 0.2rem 0 0.4rem;
  }
  .timeline-item__desc {
    font-size: 0.92rem;
    color: #475569;
    line-height: 1.5;
  }
  /* === Quick answer (AEO) === */
  .quick-answer-box {
    background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    border-left: 4px solid #0077b6;
    border-radius: 12px;
    padding: 1.25rem 1.5rem;
    margin: 1.5rem 0;
  }
  .quick-answer-box h3 {
    font-size: 1rem;
    font-weight: 800;
    color: #0a2540;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin: 0 0 0.5rem;
  }
  .quick-answer-box p {
    margin: 0;
    color: #1e293b;
    line-height: 1.6;
  }
  .quick-answer-box strong { color: #0077b6; }
</style>
