
    

    <script>
      document.addEventListener("DOMContentLoaded", () => {
        const contactForm = document.getElementById("contact-form");
        if (contactForm) {
          contactForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const name = document.getElementById("name").value;
            const phone = document.getElementById("phone").value;
            const email = document.getElementById("email").value;
            const message = document.getElementById("message").value;

            const businessWhatsappNumber = "573142891018";

            const whatsappMessage = `
                    Hola CONCASAYA, me gustaría solicitar una cotización.

                    *Nombre:* ${name}
                    *Teléfono:* ${phone}
                    *Email:* ${email}

                    *Mensaje:*
                    ${message}
                `;

            const whatsappUrl = `https://wa.me/${businessWhatsappNumber}?text=${encodeURIComponent(
              whatsappMessage
            )}`;

            window.open(whatsappUrl, "_blank");

            contactForm.reset();
          });
        }
      });
    </script>
    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({
        duration: 800,
        once: true,
      });
      const faqQuestions = document.querySelectorAll(".faq-question");
      if (faqQuestions.length > 0) {
        faqQuestions.forEach((question) => {
          question.addEventListener("click", () => {
            const answer = question.nextElementSibling;
            const icon = question.querySelector("i");
            const isExpanded = answer.style.maxHeight;

            document
              .querySelectorAll(".faq-answer")
              .forEach((a) => (a.style.maxHeight = null));
            document
              .querySelectorAll(".faq-question i")
              .forEach((i) => i.classList.remove("rotate-180"));

            if (!isExpanded) {
              answer.style.maxHeight = answer.scrollHeight + "px";
              icon.classList.add("rotate-180");
            }
          });
        });
      }
    </script>
  
    <script src="/assets/js/municipios.js"></script>
    <script src="/assets/js/nav-municipios.js"></script>
    <script src="/assets/js/nav-menu.js"></script>
    <script src="/assets/js/whatsapp-modal.js"></script>
  </body>
