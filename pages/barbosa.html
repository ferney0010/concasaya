
    

    <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
    <script>
      AOS.init({ duration: 800, once: true });
      
      // Contador animado
      function animateCounter(element) {
        const target = parseInt(element.getAttribute('data-target'));
        const duration = 2000;
        const increment = target / (duration / 16);
        let current = 0;
        
        const updateCounter = () => {
          current += increment;
          if (current < target) {
            element.textContent = Math.floor(current);
            requestAnimationFrame(updateCounter);
          } else {
            element.textContent = target;
          }
        };
        updateCounter();
      }
      
      // Observar cuando los contadores entran en vista
      const observerOptions = { threshold: 0.5 };
      const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting && !entry.target.classList.contains('counted')) {
            entry.target.classList.add('counted');
            animateCounter(entry.target);
          }
        });
      }, observerOptions);
      
      document.querySelectorAll('.counter').forEach(counter => {
        observer.observe(counter);
      });
      const faqs = document.querySelectorAll('.faq-question');
      faqs.forEach(q => {
        q.addEventListener('click', () => {
          const ans = q.nextElementSibling;
          const icon = q.querySelector('i');
          const expanded = ans.style.maxHeight;
          document.querySelectorAll('.faq-answer').forEach(a => { a.style.maxHeight = null; });
          document.querySelectorAll('.faq-question i').forEach(i => i.classList.remove('rotate-180'));
          if (!expanded) { ans.style.maxHeight = ans.scrollHeight + 'px'; icon?.classList.add('rotate-180'); }
        });
      });
    </script>
  
    <script src="/assets/js/municipios.js"></script>
    <script src="/assets/js/nav-municipios.js"></script>
    <script src="/assets/js/nav-menu.js"></script>
    <script src="/assets/js/whatsapp-modal.js"></script>
  </body>
</html>
