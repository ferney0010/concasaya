    <script>

      document.addEventListener("DOMContentLoaded", () => {

        AOS.init({ duration: 800, once: true });

        const modal = document.getElementById("modelModal");

        const openModalBtns = document.querySelectorAll(".open-modal-btn");

        const closeModalBtn = document.querySelector(".close-btn");

        const modalImage = document.getElementById("modal-image");

        const modalTitle = document.getElementById("modal-title");

        const modalSpecs = document.getElementById("modal-specs");

        const modalDesc = document.getElementById("modal-desc");

        const modalWhatsappBtn = document.getElementById("modal-whatsapp-btn");

        const modalPrice = document.getElementById("modal-price");

        const modalPriceText = document.getElementById("modal-price-text");

        const businessWhatsappNumber = "573142891018";



        openModalBtns.forEach((btn) => {

          btn.addEventListener("click", (e) => {

            // If this button targets the new "Ver más" gallery modal,
            // skip the legacy 1-image modal — the new handler (capture phase)
            // already opened the category modal.
            if (btn.dataset.category) {
              e.stopImmediatePropagation();
              return;
            }

            const model = btn.dataset.model;

            const imgSrc = btn.dataset.img;

            const specsString = btn.dataset.specs;

            const desc = btn.dataset.desc;

            const price = btn.dataset.price;

            modalImage.src = imgSrc;

            modalTitle.textContent = model;

            modalDesc.textContent = desc;

            if (price && modalPrice && modalPriceText) {

              modalPriceText.textContent = price;

              modalPrice.classList.remove("hidden");

            } else if (modalPrice) {

              modalPrice.classList.add("hidden");

            }

            modalSpecs.innerHTML = "";

            const specsArray = specsString.split("|");

            const icons = {

              "Área": "fa-ruler-combined", "Modelo de Referencia": "fa-ruler-combined",

              "Habitaciones": "fa-bed", "Baños": "fa-bath", "Niveles": "fa-layer-group",

              "Extras": "fa-star", "Característica": "fa-check-circle", "Estilo": "fa-paint-brush",

              "Ideal para": "fa-map-marker-alt", "Concepto": "fa-lightbulb", "Uso": "fa-tag",

              "Instalación": "fa-shipping-fast", "Estructura": "fa-cogs", "Techos": "fa-home",

              "Seguridad": "fa-shield-alt", "Material": "fa-cube", "Pisos": "fa-layer-group",

              "Entrega": "fa-truck-fast", "Incluye": "fa-list-check", "Forma": "fa-shapes",

              "Diseño": "fa-paint-roller", "Cubierta": "fa-home", "Personalizable": "fa-sliders",

              "Materiales": "fa-cubes-stacked", "Techo": "fa-home", "Ventanales": "fa-window-maximize",

              "Plus": "fa-plus-circle", "Detalle": "fa-eye", "Color": "fa-palette",

              "Deck": "fa-table", "Jardín": "fa-seedling", "Fachada": "fa-building",

              "Iluminación": "fa-lightbulb", "2 módulos": "fa-cubes", "Placa": "fa-cube",

              "Techo": "fa-home", "Muros": "fa-cube"

            };

            specsArray.forEach((spec) => {

              const [key, value] = spec.split(":");

              const keyTrimmed = (key || "").trim();

              const iconClass = icons[keyTrimmed] || "fa-check";

              const p = document.createElement("p");

              p.innerHTML = `<i class="fas ${iconClass} fa-fw mr-2 text-primary"></i><strong>${keyTrimmed}:</strong> ${(value || "").trim()}`;

              modalSpecs.appendChild(p);

            });

            const whatsappMessage = `Hola CONCASAYA, estoy interesado en el modelo *${model}*. Me gustaría recibir más información.`;

            modalWhatsappBtn.href = `https://wa.me/${businessWhatsappNumber}?text=${encodeURIComponent(whatsappMessage)}`;

            modal.style.display = "flex";

          });

        });

        const closeModal = () => { modal.style.display = "none"; };

        closeModalBtn.addEventListener("click", closeModal);

        window.addEventListener("click", (event) => { if (event.target == modal) closeModal(); });

      });

    </script>

    <script>
      // ====== Category Gallery Modal (Ver más) =========================
      // Opens a modal showing all thumbs filtered by data-category + data-variant.
      // Categories defined in tags injected by tag_thumbs_by_gallery.py +
      // tag_cabin_thumbs.py. Tabs inside the modal allow switching between
      // variants (e.g. "Con Altillo" / "De Vidrio" for cabanas).
      (function() {
        const WA = '573142891018';
        const modal      = document.getElementById('categoryGalleryModal');
        if (!modal) { console.warn('[catModal] No existe #categoryGalleryModal'); return; }
        const titleEl    = document.getElementById('cat-modal-title');
        const eyebrowEl  = document.getElementById('cat-modal-eyebrow');
        const subtitleEl = document.getElementById('cat-modal-subtitle');
        const countEl    = document.getElementById('cat-modal-count');
        const tabsEl     = document.getElementById('cat-modal-tabs');
        const gridEl     = document.getElementById('cat-modal-grid');
        const waBtn      = document.getElementById('cat-modal-whatsapp');
        const closeBtn   = modal.querySelector('.close-cat-modal');

        // Map of category -> display name + which variants to show as tabs
        const CAT_META = {
          cabana:     { name: 'Cabañas Prefabricadas',           eyebrow: 'Cabañas',        variantOrder: ['altillo','vidrio'], variantLabel: { altillo: 'Con Altillo', vidrio: 'De Vidrio' } },
          plaqueta:   { name: 'Plaqueta de 1 Piso',              eyebrow: 'Plaqueta',       variantOrder: ['default'],          variantLabel: { default: 'Todas' } },
          plaqueta1p: { name: 'Plaqueta de 1 Piso',              eyebrow: 'Plaqueta 1P',    variantOrder: ['default'],          variantLabel: { default: 'Todas' } },
          'l':           { name: 'Casas en L',                      eyebrow: 'Casas en L',     variantOrder: ['default'],          variantLabel: { default: 'Todas' } },
          '2pisos':   { name: 'Casas Prefabricadas de Dos Pisos',eyebrow: '2 Pisos',        variantOrder: ['default'],          variantLabel: { default: 'Todas' } },
          cubo:       { name: 'Casas Cubo y Mediterráneas',      eyebrow: 'Cubo / Med',     variantOrder: ['default'],          variantLabel: { default: 'Todas' } },
          eps:        { name: 'Casas en Sistema EPS',            eyebrow: 'Sistema EPS',    variantOrder: ['default'],          variantLabel: { default: 'Todas' } },
          materiales: { name: 'Materiales y Acabados',           eyebrow: 'Acabados',       variantOrder: ['default'],          variantLabel: { default: 'Todas' } },
          proceso:    { name: 'Proceso Constructivo',            eyebrow: 'Proceso',        variantOrder: ['default'],          variantLabel: { default: 'Todas' } }
        };

        // For 'default' variant in script-generated thumbs, normalize to "todas" for UI
        function normalizeVariant(v) { return v === 'default' ? 'todas' : v; }

        // Open from a card button
        function openFromCard(btn) {
          const category = btn.dataset.category;
          const variant  = btn.dataset.variant || 'todas';
          const model    = btn.dataset.model || '';
          const desc     = btn.dataset.desc  || '';
          open(category, variant, { model, desc });
        }

        function open(category, variant, ctx) {
          variant = normalizeVariant(variant);
          const meta = CAT_META[category];
          if (!meta) { console.warn('[catModal] unknown category:', category); return; }

          // Pull all thumbs that match the category, regardless of variant
          // (we render tabs dynamically)
          const allThumbs = Array.from(document.querySelectorAll(
            '.gallery-thumb[data-category="' + category + '"]'
          ));
          if (allThumbs.length === 0) {
            console.warn('[catModal] no thumbs for', category);
          }

          // Build variant buckets (use the variant on each thumb, normalize 'default' -> 'todas')
          const buckets = {};
          allThumbs.forEach(function(t) {
            const v = normalizeVariant(t.dataset.variant || 'todas');
            (buckets[v] = buckets[v] || []).push(t);
          });

          // Header
          titleEl.textContent   = meta.name;
          eyebrowEl.textContent = meta.eyebrow;
          subtitleEl.innerHTML  = (ctx && ctx.model)
            ? '<i class="fas fa-eye text-primary mr-1"></i>Modelos similares a: <strong>' + escapeHtml(ctx.model) + '</strong>'
            : 'Click en cualquier imagen para verla en tamaño completo';

          // Tabs — use the canonical variantOrder, plus any extra buckets found
          const variantOrder = meta.variantOrder.map(normalizeVariant);
          const extraVariants = Object.keys(buckets).filter(function(v) { return variantOrder.indexOf(v) === -1; });
          const finalOrder = variantOrder.concat(extraVariants);
          tabsEl.innerHTML = '';
          finalOrder.forEach(function(v) {
            const count = (buckets[v] || []).length;
            if (count === 0) return;
            const btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'cat-modal-tab' + (v === variant ? ' active' : '');
            btn.dataset.variant = v;
            btn.setAttribute('role', 'tab');
            btn.setAttribute('aria-selected', v === variant ? 'true' : 'false');
            btn.innerHTML = '<span>' + escapeHtml(meta.variantLabel[v] || v) + '</span> <span class="cat-tab-count">' + count + '</span>';
            btn.addEventListener('click', function() {
              tabsEl.querySelectorAll('.cat-modal-tab').forEach(function(t) {
                const isActive = t === btn;
                t.classList.toggle('active', isActive);
                t.setAttribute('aria-selected', isActive ? 'true' : 'false');
              });
              renderGrid(buckets[v] || []);
            });
            tabsEl.appendChild(btn);
          });
          // Hide tabs row if only 1 variant
          tabsEl.style.display = finalOrder.filter(function(v){ return (buckets[v]||[]).length>0; }).length > 1 ? 'flex' : 'none';

          // If requested variant has no images, fall back to first non-empty
          const fallback = finalOrder.find(function(v){ return (buckets[v]||[]).length>0; });
          const activeVariant = (buckets[variant] && buckets[variant].length) ? variant : fallback;
          renderGrid(buckets[activeVariant] || []);

          // WhatsApp link
          const msg = 'Hola, me interesa ver más modelos de ' + meta.name + (ctx && ctx.model ? ' (similar a ' + ctx.model + ')' : '') + '. ¿Me pueden enviar más información?';
          waBtn.href = 'https://wa.me/' + WA + '?text=' + encodeURIComponent(msg);

          modal.style.display = 'flex';
          document.body.style.overflow = 'hidden';
        }

        function renderGrid(thumbs) {
          gridEl.innerHTML = '';
          countEl.textContent = String(thumbs.length);
          if (thumbs.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'cat-modal-empty';
            empty.innerHTML = '<i class="fas fa-image"></i><p>No hay imágenes en esta variante todavía.</p>';
            gridEl.appendChild(empty);
            return;
          }
          thumbs.forEach(function(srcThumb) {
            // Clone the thumb so we can move it freely; remove the data-category/data-variant
            // so the in-page lightbox (if it scans) does not double-bind.
            const clone = srcThumb.cloneNode(true);
            // Ensure its click triggers the existing lightbox
            // (existing lightbox uses delegation, so the clone keeps working as long as it's in DOM)
            gridEl.appendChild(clone);
          });
          // Re-query the lightbox thumbs so navigation stays within the modal grid
          if (typeof window.__resetLightbox === 'function') {
            try { window.__resetLightbox(); } catch (e) {}
          }
        }

        function close() {
          modal.style.display = 'none';
          document.body.style.overflow = '';
        }

        function escapeHtml(s) {
          return String(s).replace(/[&<>"']/g, function(c){
            return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c];
          });
        }

        // Wire up: every .open-modal-btn that has data-category opens this modal
        document.querySelectorAll('.open-modal-btn[data-category]').forEach(function(btn) {
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopImmediatePropagation(); // override the original modal handler
            openFromCard(btn);
          }, true); // capture phase to beat the older handler
        });

        closeBtn.addEventListener('click', close);
        modal.addEventListener('click', function(e) { if (e.target === modal) close(); });
        document.addEventListener('keydown', function(e) {
          if (modal.style.display === 'flex' && e.key === 'Escape') close();
        });
      })();
    </script>

    <!-- Cabañas Tabs: switch entre Con Altillo / De Vidrio -->
    <script>
      (function() {
        const tabs = document.querySelectorAll('.cabin-tab');
        const panels = document.querySelectorAll('.cabin-panel');
        if (!tabs.length || !panels.length) return;

        tabs.forEach(tab => {
          tab.addEventListener('click', () => {
            const target = tab.dataset.tab;
            tabs.forEach(t => {
              const isActive = t === tab;
              t.classList.toggle('active', isActive);
              t.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });
            panels.forEach(p => {
              const isActive = p.dataset.panel === target;
              p.classList.toggle('active', isActive);
              if (isActive) { p.removeAttribute('hidden'); } else { p.setAttribute('hidden', ''); }
            });
            // Reset lightbox state to avoid stale index after tab switch
            if (typeof window.__resetLightbox === 'function') { try { window.__resetLightbox(); } catch(e) {} }
          });
        });
      })();
    </script>

  

    <!-- Lightbox para galería (contenido y listeners se inicializan UNA sola vez al cargar) -->
    <div id="lightbox" class="lightbox" aria-hidden="true">
      <button class="lightbox-close" aria-label="Cerrar (Esc)"><i class="fas fa-times"></i></button>
      <button class="lightbox-nav lightbox-prev" aria-label="Imagen anterior (←)"><i class="fas fa-chevron-left"></i></button>
      <div class="lightbox-counter" id="lightbox-counter">1 / 1</div>
      <div class="lightbox-loader" id="lightbox-loader" aria-hidden="true">
        <div class="lightbox-spinner"></div>
        <span>Cargando imagen...</span>
      </div>
      <img id="lightbox-img" src="" alt="Imagen del catálogo CONCASAYA" />
      <button class="lightbox-nav lightbox-next" aria-label="Imagen siguiente (→)"><i class="fas fa-chevron-right"></i></button>
      <div class="lightbox-hint" aria-hidden="true">
        <span><i class="fas fa-keyboard mr-1"></i>← → navegar</span>
        <span><i class="fas fa-times mr-1"></i>Esc cerrar</span>
      </div>

    <script>
      // ====== Lightbox para galería (v6: HTML estático + clase correcta) =====

      (function() {
        const lightbox       = document.getElementById('lightbox');
        const lightboxImg    = document.getElementById('lightbox-img');
        const lightboxCounter= document.getElementById('lightbox-counter');
        const lightboxLoader = document.getElementById('lightbox-loader');
        const lightboxClose  = lightbox ? lightbox.querySelector('.lightbox-close') : null;
        const lightboxPrev   = lightbox ? lightbox.querySelector('.lightbox-prev')  : null;
        const lightboxNext   = lightbox ? lightbox.querySelector('.lightbox-next')  : null;

        if (!lightbox || !lightboxImg || !lightboxClose || !lightboxPrev || !lightboxNext) {
          console.warn('[lightbox] Elementos no encontrados, lightbox deshabilitado.');
          return;
        }

        let thumbs = [];
        let currentIndex = 0;
        let isLoading = false;

        function getThumbs() {
          // Si el modal de categoría está abierto, los thumbs son los clones del grid del modal
          const catModal = document.getElementById('categoryGalleryModal');
          if (catModal && catModal.style.display === 'flex') {
            return Array.from(catModal.querySelectorAll('#cat-modal-grid [data-lightbox="catalog"]'));
          }
          // Si no, excluir thumbs dentro de paneles ocultos (tabs de Cabañas)
          return Array.from(document.querySelectorAll('[data-lightbox="catalog"]')).filter(function(t) {
            // excluir thumbs que estén dentro de cualquier modal oculto
            if (t.closest('.modal[style*="display: none"]')) return false;
            const panel = t.closest('.cabin-panel');
            if (panel && panel.hasAttribute('hidden')) return false;
            return true;
          });
        }

        // Resetear estado del lightbox cuando se cambian tabs
        window.__resetLightbox = function() {
          thumbs = getThumbs();
          currentIndex = 0;
        };

        function openLightbox(idx) {
          thumbs = getThumbs();
          if (thumbs.length === 0) return;
          currentIndex = Math.max(0, Math.min(idx, thumbs.length - 1));
          updateLightbox();
          lightbox.classList.add('is-open');
          lightbox.setAttribute('aria-hidden', 'false');
          document.body.style.overflow = 'hidden';
        }

        function closeLightbox() {
          lightbox.classList.remove('is-open');
          lightbox.setAttribute('aria-hidden', 'true');
          document.body.style.overflow = '';
          setTimeout(function() {
            if (!lightbox.classList.contains('is-open')) lightboxImg.src = '';
          }, 200);
        }

        function updateLightbox() {
          const t = thumbs[currentIndex];
          if (!t) return;
          const href = t.getAttribute('data-href') || t.getAttribute('href');
          if (!href) return;
          isLoading = true;
          lightboxLoader.classList.add('is-active');
          lightboxImg.classList.remove('is-loaded');
          const preload = new Image();
          preload.onload = function() {
            lightboxImg.src = href;
            lightboxImg.alt = t.getAttribute('aria-label') || 'Imagen del catálogo CONCASAYA';
            isLoading = false;
            lightboxLoader.classList.remove('is-active');
            lightboxImg.classList.add('is-loaded');
          };
          preload.onerror = function() {
            isLoading = false;
            lightboxLoader.classList.remove('is-active');
            lightboxImg.alt = 'Error al cargar la imagen';
          };
          preload.src = href;
          lightboxCounter.textContent = (currentIndex + 1) + ' / ' + thumbs.length;
        }

        function prevImage() {
          if (isLoading) return;
          thumbs = getThumbs();
          if (thumbs.length === 0) return;
          currentIndex = (currentIndex - 1 + thumbs.length) % thumbs.length;
          updateLightbox();
        }

        function nextImage() {
          if (isLoading) return;
          thumbs = getThumbs();
          if (thumbs.length === 0) return;
          currentIndex = (currentIndex + 1) % thumbs.length;
          updateLightbox();
        }

        // ====== DELEGACIÓN DE EVENTOS (captura TODOS los thumbs, incluso los inyectados) ======
        document.addEventListener('click', function(e) {
          const thumb = e.target.closest && e.target.closest('[data-lightbox="catalog"]');
          if (!thumb) return;
          e.preventDefault();
          e.stopPropagation();
          if (typeof e.stopImmediatePropagation === 'function') e.stopImmediatePropagation();
          thumbs = getThumbs();
          const idx = thumbs.indexOf(thumb);
          if (idx >= 0) openLightbox(idx);
          return false;
        }, true);  // capture phase

        // ====== Listeners de los controles del lightbox ======
        lightboxClose.addEventListener('click', function(e) { e.stopPropagation(); closeLightbox(); });
        lightboxPrev.addEventListener('click',  function(e) { e.stopPropagation(); prevImage();   });
        lightboxNext.addEventListener('click',  function(e) { e.stopPropagation(); nextImage();   });

        // Click en el fondo cierra (pero no en la imagen ni en los controles)
        lightbox.addEventListener('click', function(e) {
          if (e.target === lightbox) closeLightbox();
        });

        // ====== Teclado ======
        document.addEventListener('keydown', function(e) {
          if (!lightbox.classList.contains('is-open')) return;
          if (e.key === 'Escape')       { closeLightbox(); return; }
          if (e.key === 'ArrowLeft')    { e.preventDefault(); prevImage(); return; }
          if (e.key === 'ArrowRight')   { e.preventDefault(); nextImage(); return; }
        });

        // ====== Swipe en móvil ======
        let touchStartX = 0;
        lightbox.addEventListener('touchstart', function(e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
        lightbox.addEventListener('touchend', function(e) {
          const dx = e.changedTouches[0].screenX - touchStartX;
          if (Math.abs(dx) > 50) {
            if (dx > 0) prevImage();
            else nextImage();
          }
        }, { passive: true });
      })();
    </script>



<!-- ====== LIGHTBOX CSS (movido aquí para evitar bug de CSS Nesting de Chrome 120+ con ::after) ====== -->
    <style>
      .lightbox { position: fixed; inset: 0; z-index: 9999; background: rgba(0,0,0,0.92); display: none; align-items: center; justify-content: center; padding: 1rem; opacity: 0; visibility: hidden; transition: opacity 0.3s ease; cursor: zoom-out; pointer-events: none; }

      .lightbox-close:hover { background: rgba(220, 38, 38, 1); transform: rotate(90deg) scale(1.1); }
      .lightbox-counter { position: absolute; top: 1rem; left: 1rem; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); color: white; padding: 0.5rem 1rem; border-radius: 9999px; font-weight: 600; font-size: 0.875rem; z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.2s ease; }
      .lightbox.is-open .lightbox-counter { opacity: 1; visibility: visible; }
      .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 3.5rem; height: 3.5rem; border-radius: 9999px; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); color: white; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.25rem; transition: all 0.2s ease; z-index: 10000; border: 2px solid rgba(255,255,255,0.2); }
      .lightbox-nav:hover { background: rgba(0,0,0,0.9); transform: translateY(-50%) scale(1.1); }
      .lightbox-prev { left: 1rem; }
      .lightbox-next { right: 1rem; }
      .lightbox-loader { position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; color: white; pointer-events: none; opacity: 0; visibility: hidden; }
      .lightbox-loader.is-active { display: flex; opacity: 1; visibility: visible; }
      .lightbox-spinner { width: 3rem; height: 3rem; border: 4px solid rgba(255,255,255,0.2); border-top-color: #00a8e8; border-radius: 50%; animation: lightboxSpin 0.8s linear infinite; }
      @keyframes lightboxSpin { to { transform: rotate(360deg); } }
      .lightbox-hint { position: absolute; bottom: 1rem; left: 50%; transform: translateX(-50%); display: flex; gap: 1rem; background: rgba(0,0,0,0.5); backdrop-filter: blur(10px); color: rgba(255,255,255,0.8); padding: 0.5rem 1rem; border-radius: 9999px; font-size: 0.75rem; z-index: 10000; opacity: 0; visibility: hidden; transition: opacity 0.3s ease; }
      .lightbox.is-open .lightbox-hint { opacity: 1; visibility: visible; }
      .lightbox-hint span { display: inline-flex; align-items: center; }
      @media (max-width: 640px) { .lightbox-nav { width: 2.5rem; height: 2.5rem; font-size: 1rem; } .lightbox-hint { display: none; } }
    </style>
