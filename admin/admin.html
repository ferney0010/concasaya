<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | CONCASAYA</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>
</head>
<body class="bg-gray-100">

    <div id="login-section" class="flex items-center justify-center min-h-screen">
        <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
            <h2 class="text-2xl font-bold text-center">Administración CONCASAYA</h2>
            <form id="login-form" class="space-y-6">
                <div>
                    <label for="email" class="block text-sm font-medium">Correo</label>
                    <input type="email" id="email" required class="w-full px-3 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <div>
                    <label for="password" class="block text-sm font-medium">Contraseña</label>
                    <input type="password" id="password" required class="w-full px-3 py-2 mt-1 border rounded-md focus:ring-blue-500 focus:border-blue-500">
                </div>
                <button type="submit" class="w-full px-4 py-2 font-bold text-white bg-blue-600 rounded-md hover:bg-blue-700">Entrar</button>
            </form>
            <p id="auth-error" class="text-red-500 text-center text-sm"></p>
        </div>
    </div>

    <div id="admin-panel" class="hidden">
        <header class="bg-white shadow-md">
            <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
                <h1 class="text-xl font-bold">Panel de Administración</h1>
                <button id="logout-btn" class="px-4 py-2 font-bold text-white bg-red-600 rounded-md hover:bg-red-700">Cerrar Sesión</button>
            </nav>
        </header>

        <main class="container mx-auto p-6 space-y-12">
            <section id="gallery-management">
                <h2 class="text-3xl font-bold mb-6 border-b pb-2">Gestionar Galería</h2>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1 p-6 bg-white rounded-lg shadow-md">
                        <h3 class="text-lg font-semibold mb-4">Añadir / Editar Imagen</h3>
                        <form id="gallery-form" class="space-y-4">
                            <input type="hidden" id="gallery-id">
                            <div>
                                <label for="gallery-title" class="block text-sm font-medium">Título</label>
                                <input type="text" id="gallery-title" required class="w-full px-3 py-2 mt-1 border rounded-md">
                            </div>
                            <div>
                                <label for="gallery-category" class="block text-sm font-medium">Categoría</label>
                                <select id="gallery-category" required class="w-full px-3 py-2 mt-1 border rounded-md"></select>
                            </div>
                            <div>
                                <label for="gallery-image" class="block text-sm font-medium">Archivo de Imagen (.webp)</label>
                                <input type="file" id="gallery-image" accept="image/webp" class="w-full mt-1 text-sm">
                            </div>
                            <button type="submit" class="w-full px-4 py-2 font-bold text-white bg-blue-600 rounded-md hover:bg-blue-700">Guardar Imagen</button>
                            <button type="button" id="cancel-gallery-edit" class="w-full px-4 py-2 mt-2 text-sm text-center text-gray-600 rounded-md hover:bg-gray-200">Cancelar Edición</button>
                        </form>
                    </div>
                     <div class="lg:col-span-2 p-6 bg-white rounded-lg shadow-md">
                        <h3 class="text-lg font-semibold mb-4">Gestionar Categorías</h3>
                        <form id="category-form" class="flex gap-2 mb-4">
                             <input type="text" id="category-name" placeholder="Nombre de la nueva categoría" required class="flex-grow px-3 py-2 border rounded-md">
                             <button type="submit" class="px-4 py-2 font-bold text-white bg-green-600 rounded-md hover:bg-green-700">Crear</button>
                        </form>
                        <div id="categories-list" class="space-y-2"></div>
                    </div>
                </div>
                <div class="mt-8 p-6 bg-white rounded-lg shadow-md">
                     <h3 class="text-lg font-semibold mb-4">Imágenes Subidas</h3>
                    <div id="gallery-list" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-4"></div>
                </div>
            </section>
            
            <section id="blog-management">
                <h2 class="text-3xl font-bold mb-6 border-b pb-2">Gestionar Blog</h2>
                <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                    <div class="lg:col-span-1 p-6 bg-white rounded-lg shadow-md">
                        <h3 class="text-lg font-semibold mb-4">Añadir / Editar Entrada</h3>
                        <form id="blog-form" class="space-y-4">
                            <input type="hidden" id="blog-id">
                            <div>
                                <label for="blog-title" class="block text-sm font-medium">Título</label>
                                <input type="text" id="blog-title" required class="w-full px-3 py-2 mt-1 border rounded-md">
                            </div>
                            <div>
                                <label for="blog-content" class="block text-sm font-medium">Contenido</label>
                                <textarea id="blog-content" rows="6" required class="w-full px-3 py-2 mt-1 border rounded-md"></textarea>
                            </div>
                            <div>
                                <label for="blog-image" class="block text-sm font-medium">Imagen Principal (.webp)</label>
                                <input type="file" id="blog-image" accept="image/webp" class="w-full mt-1 text-sm">
                            </div>
                            <button type="submit" class="w-full px-4 py-2 font-bold text-white bg-blue-600 rounded-md hover:bg-blue-700">Guardar Entrada</button>
                            <button type="button" id="cancel-blog-edit" class="w-full px-4 py-2 mt-2 text-sm text-center text-gray-600 rounded-md hover:bg-gray-200">Cancelar Edición</button>
                        </form>
                    </div>
                    <div class="lg:col-span-2 p-6 bg-white rounded-lg shadow-md">
                        <h3 class="text-lg font-semibold mb-4">Entradas Publicadas</h3>
                        <div id="blog-list" class="space-y-4"></div>
                    </div>
                </div>
            </section>
        </main>
    </div>
    
<script type="module" src="./admin.js"></script></body>
</html>
